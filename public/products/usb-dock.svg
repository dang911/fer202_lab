<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" rx="24" fill="#0f172a"/>
  <circle cx="200" cy="200" r="140" fill="url(#dockgrad)" opacity="0.15"/>
  <defs>
    <linearGradient id="dockgrad" x1="120" y1="120" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Dock Body -->
  <rect x="90" y="150" width="220" height="100" rx="14" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Ports -->
  <rect x="110" y="175" width="24" height="12" rx="2" fill="#3b82f6"/>
  <rect x="145" y="175" width="24" height="12" rx="2" fill="#3b82f6"/>
  <rect x="180" y="175" width="24" height="12" rx="2" fill="#3b82f6"/>
  <rect x="215" y="178" width="16" height="6" rx="3" fill="#10b981"/>
  <rect x="240" y="178" width="16" height="6" rx="3" fill="#10b981"/>
  <rect x="268" y="172" width="24" height="18" rx="2" fill="#475569"/>
  <!-- Cable -->
  <path d="M90 200 C50 200 50 130 90 130 L110 130" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- USB C connector tip -->
  <rect x="110" y="125" width="24" height="10" rx="3" fill="#94a3b8"/>
  <!-- Status LED -->
  <circle cx="200" cy="225" r="4" fill="#10b981"/>
</svg>
