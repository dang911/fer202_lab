<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" rx="24" fill="#0f172a"/>
  <circle cx="200" cy="200" r="140" fill="url(#speakergrad)" opacity="0.15"/>
  <defs>
    <linearGradient id="speakergrad" x1="120" y1="80" x2="280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Cylinder Speaker -->
  <rect x="150" y="110" width="100" height="180" rx="28" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Grille Pattern -->
  <g fill="#ec4899" opacity="0.8">
    <circle cx="180" cy="150" r="3"/>
    <circle cx="200" cy="150" r="3"/>
    <circle cx="220" cy="150" r="3"/>
    <circle cx="170" cy="170" r="3"/>
    <circle cx="190" cy="170" r="3"/>
    <circle cx="210" cy="170" r="3"/>
    <circle cx="230" cy="170" r="3"/>
    <circle cx="180" cy="190" r="3"/>
    <circle cx="200" cy="190" r="3"/>
    <circle cx="220" cy="190" r="3"/>
    <circle cx="170" cy="210" r="3"/>
    <circle cx="190" cy="210" r="3"/>
    <circle cx="210" cy="210" r="3"/>
    <circle cx="230" cy="210" r="3"/>
    <circle cx="180" cy="230" r="3"/>
    <circle cx="200" cy="230" r="3"/>
    <circle cx="220" cy="230" r="3"/>
  </g>
  <!-- Top button area -->
  <ellipse cx="200" cy="120" rx="35" ry="8" fill="#475569"/>
  <!-- Lanyard loop -->
  <path d="M230 115 Q260 100 250 140" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
