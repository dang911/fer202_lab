<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" rx="24" fill="#0f172a"/>
  <circle cx="200" cy="200" r="140" fill="url(#lightgrad)" opacity="0.15"/>
  <defs>
    <linearGradient id="lightgrad" x1="100" y1="120" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="180" x2="200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- ScreenBar body -->
  <rect x="70" y="160" width="260" height="20" rx="10" fill="#334155" stroke="#475569" stroke-width="3"/>
  <line x1="85" y1="176" x2="315" y2="176" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
  <!-- Light Beam Cone -->
  <polygon points="100,180 300,180 360,290 40,290" fill="url(#glow)"/>
  <!-- Clip / Mount on monitor -->
  <path d="M185 160 L185 140 Q185 130 200 130 Q215 130 215 140 L215 160" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <rect x="180" y="125" width="40" height="20" rx="6" fill="#475569"/>
  <!-- Monitor bezel preview below -->
  <rect x="90" y="210" width="220" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3"/>
</svg>
